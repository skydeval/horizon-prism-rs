name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: horizon-prism-rs
    steps:
      - uses: actions/checkout@v4

      - name: Private tables are named only under src/private_tier/
        run: |
          rc=0
          grep -rlE 'private_(posts|audiences|tombstones|owner_ready|owner_eligible|bookmarks|threadgates|postgates|quote_refs|notifications|notification_seen|notification_prefs|activity_subscriptions|post_fanout|root_gate_fetches|appearance)' --include='*.rs' src > /tmp/private_refs || rc=$?
          if [ "$rc" -gt 1 ]; then echo "grep failed ($rc)"; exit 1; fi
          leaks="$(grep -v '^src/private_tier/' /tmp/private_refs || true)"
          if [ -n "$leaks" ]; then echo "private-tier table referenced outside src/private_tier/:"; echo "$leaks"; exit 1; fi

      - name: System-account tables are named only under src/system_accounts/
        run: |
          rc=0
          grep -rl 'sysacct_' --include='*.rs' src > /tmp/sysacct_refs || rc=$?
          if [ "$rc" -gt 1 ]; then echo "grep failed ($rc)"; exit 1; fi
          leaks="$(grep -v '^src/system_accounts/' /tmp/sysacct_refs || true)"
          if [ -n "$leaks" ]; then echo "system-accounts table referenced outside src/system_accounts/:"; echo "$leaks"; exit 1; fi

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: horizon-prism-rs
          shared-key: clippy

      - name: proto-blue-codegen (the lexicon build runs it)
        run: command -v proto-blue-codegen || cargo install proto-blue-codegen --locked --version 0.3.3

      - name: Clippy
        working-directory: horizon-prism-rs
        run: cargo clippy --release --locked --all-targets -- -D warnings

  build-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.90.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: horizon-prism-rs
          shared-key: tests

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: proto-blue-codegen (the lexicon build runs it)
        run: command -v proto-blue-codegen || cargo install proto-blue-codegen --locked --version 0.3.3

      - name: Build the tests once
        working-directory: horizon-prism-rs
        run: cargo nextest archive --release --locked --all-targets --archive-file "$RUNNER_TEMP/tests.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: tests
          path: ${{ runner.temp }}/tests.tar.zst
          retention-days: 1

  test:
    needs: build-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    env:
      HPRS_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
      HPRS_TEST_REDIS_URL: redis://127.0.0.1:6379
      HPRS_REQUIRE_REPO_TEXT: "1"
    steps:
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - uses: actions/download-artifact@v4
        with:
          name: tests
          path: ${{ runner.temp }}

      - name: Postgres 16 and Redis 7
        run: |
          docker run -d --name hprs-pg -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=test \
            --tmpfs /var/lib/postgresql/data:rw,size=4g --shm-size=256m \
            postgres:16 -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
            -c max_connections=300 -c shared_buffers=512MB
          docker run -d --name hprs-redis -p 127.0.0.1:6379:6379 redis:7-alpine
          for i in $(seq 1 60); do
            if docker exec hprs-pg pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Tests, part ${{ matrix.partition }} of 4
        # The microbenchmark has a 5 µs wall-clock bound a shared runner can miss.
        run: >
          cargo nextest run
          --archive-file "$RUNNER_TEMP/tests.tar.zst"
          --workspace-remap horizon-prism-rs
          --partition count:${{ matrix.partition }}/4
          --no-fail-fast
          -E 'not test(lean_decode_microbenchmark)'
