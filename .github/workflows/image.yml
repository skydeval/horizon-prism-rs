name: Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "A version tag to build and publish (e.g. v0.2.0); empty builds this branch as sha-<commit>"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: The tag matches the crate version
        if: env.TAG != ''
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' horizon-prism-rs/Cargo.toml | head -n 1)"
          if [ "v$crate" != "$TAG" ]; then
            echo "tag $TAG does not match crate version $crate"
            exit 1
          fi

      - name: The compose file defaults to this version
        if: github.event_name == 'push'
        run: |
          crate="${TAG#v}"
          if ! grep -q "horizon-prism-rs:\${APP_VERSION:-$crate}" docker/docker-compose.yml; then
            echo "docker/docker-compose.yml does not default to $crate"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }},enable=${{ env.TAG != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ env.TAG != '' }}
            type=raw,value=latest,enable=${{ env.TAG != '' }}
            type=sha,enable=${{ env.TAG == '' }}
          labels: |
            org.opencontainers.image.title=Horizon-Prism
            org.opencontainers.image.licenses=MPL-2.0

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
