# horizon-firehose config: Community A relay (design v1 §5.1).
# Host is relay.community-a.example: relay.community-a.example failed TLS when probed on
# 2026-09-25, while relay.community-a.example reported a live head sequence.
# Every key below is required or explicitly pinned; horizon-firehose rejects
# unknown keys. stream_key and max_stream_len have no code default and MUST be
# identical across all three sidecars.

config_version = 1

[relay]
url = "wss://relay.community-a.example/xrpc/com.atproto.sync.subscribeRepos"
# No fallbacks: cursors are per relay URL, so failover resumes at live tip and
# opens a gap. Relay diversity comes from running three sidecars instead.
fallbacks = []
reconnect_initial_delay_ms = 1000
reconnect_max_delay_ms = 60000
failover_threshold = 5
failover_cooldown_seconds = 600
tls_extra_ca_file = ""

[redis]
url = "redis://redis:6379"
stream_key = "firehose:events"
# Three sidecars share this stream (~4,500 events/s combined): 1.5M entries is
# ~330 s of buffer (design §5.2).
max_stream_len = 1500000
cleanup_unknown_cursors = false

[filter]
record_types = []

[cursor]
save_interval_seconds = 5
# Exit instead of silently resuming from live tip: a skip must be visible (design §5.7).
on_stale_cursor = "exit"
on_protocol_error = "exit"

[publisher]
max_event_size_bytes = 4194304
# Skip (not fail_hard): fail_hard would let one crafted commit stop all ingest.
# An oversize commit only affects its own repo; see design §6.11.5.
on_oversize = "skip_with_log"

[logging]
level = "info"
format = "json"
