# horizon-firehose config: microcosm.blue relay (design v1 §5.1).
# Every key below is required or explicitly pinned; horizon-firehose rejects
# unknown keys. stream_key and max_stream_len have no code default and MUST be
# identical across all three sidecars.

config_version = 1

[relay]
url = "wss://relay.fire.hose.cam/xrpc/com.atproto.sync.subscribeRepos"
# No fallbacks: cursors are per relay URL, so failover resumes at live tip and
# opens a gap. Relay diversity comes from running three sidecars instead.
fallbacks = []
reconnect_initial_delay_ms = 1000
reconnect_max_delay_ms = 60000
failover_threshold = 5
failover_cooldown_seconds = 600
tls_extra_ca_file = ""

[redis]
url = "redis://redis:6379"
stream_key = "firehose:events"
max_stream_len = 500000
cleanup_unknown_cursors = false

[filter]
record_types = []

[cursor]
save_interval_seconds = 5
on_stale_cursor = "live_tip"
on_protocol_error = "reconnect_from_live_tip"

[publisher]
max_event_size_bytes = 1048576
on_oversize = "skip_with_log"

[logging]
level = "info"
format = "json"
