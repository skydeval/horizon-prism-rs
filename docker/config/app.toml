# horizon-prism-rs application config (design v2). Non-secret settings only;
# secrets and deployment-specific values come from APP_* environment variables
# (design §11.3). Unknown keys fail startup. Every value below is the default;
# an omitted key takes the same value.

[http]
bind = "0.0.0.0:3030"
# X-Forwarded-For is honored only from this peer address (Caddy's fixed
# compose address, design §7.4).
trusted_proxy = "172.30.0.10"

[metrics]
bind = "0.0.0.0:9091"

# The DNS resolvers this server asks, as IP addresses (port 53). Empty means
# the ones in /etc/resolv.conf. Lookups made while serving public requests,
# and lookups of names that a member's mutes, bookmarks or subscriptions
# point at, go to public_nameservers. Background work, such as reading the
# accounts this server stores, goes to internal_nameservers. A shared
# resolver lets anyone who queries it see which names were looked up
# lately, so internal_nameservers should be a resolver that only this
# deployment uses and that resolves from the root itself (for example an
# unbound container), not a public one or Docker's 127.0.0.11. The server
# logs a warning at startup when it plainly is not.
[net]
public_nameservers = []
internal_nameservers = []

[indexing]
# off | community_scoped | full (full is refused). Default: off.
# Set this, or run `admin indexing public-scope`, to change it (design §3.3).
# public_scope = "off"
fill_max_wait_hours = 24

[scope]
# members_only | members_and_follows | members_and_interactions | members_and_one_hop
policy = "members_and_one_hop"
rebuild_grace_days = 7
# Follow-derived scope growth per member (design §9.4).
max_follow_scope_per_member = 10000

[community]
# Auto-enroll triggers only from getTimeline / listNotifications / getUnreadCount
# (design §9.2), never from Thread Lens, private or index-request calls.
auto_enroll = true
max_auto_enroll_per_hour = 50
max_members = 1000
# Auto-enrolled members that have never been ready (first_ready_at NULL) after
# this many days are removed (design §9.2).
never_ready_expiry_days = 7
# Refused enrollments are cached this long before getRepoStatus is re-checked.
enroll_refusal_cache_secs = 3600
# PDS hosts eligible for auto-enroll (exact host or *.suffix). Empty = the
# community network's pds_patterns below. Others need `admin member add`.
enroll_pds_patterns = []
# Seconds sent as `Retry-After` on every `400 NotReady` (account indexing in
# progress). A constant hint for clients, not an estimate of progress.
not_ready_retry_secs = 5

[firehose]
stream_key = "firehose:events"
group = "horizon-prism-rs"
consumer_name = "app"
batch_size = 500
dead_letter_stream = "firehose:dead-letters"
# Deterministic failures are retried in place this many times, then dead-lettered
# as metadata plus the first 4 KiB of data (design §5.3).
deterministic_attempts = 5
dead_letter_maxlen = 10000
# Relays that must crawl the community PDS; private reads gate on the slowest of
# these (design §5.3). Labels come from [firehose.relay_labels].
private_relays = ["bsky", "microcosm"]
lag_warn_entries = 100000
# Relay coverage tracker (design §5.11).
coverage_window_secs = 600
coverage_capacity = 3000000

# Short labels for each sidecar's _relay value (the full relay URL); used as the
# metrics relay label. Unlisted values are labeled "other".
[firehose.relay_labels]
"wss://bsky.network/xrpc/com.atproto.sync.subscribeRepos" = "bsky"
"wss://relay.fire.hose.cam/xrpc/com.atproto.sync.subscribeRepos" = "microcosm"
"wss://relay.community-a.example/xrpc/com.atproto.sync.subscribeRepos" = "community-a"

[identity]
plc_url = "https://plc.directory"
did_fresh_secs = 3600
did_stale_max_secs = 86400
# Bounds kryphocron's DID-document cache on the JWT path (design §6.7).
jwt_issuer_tracker_max = 20000
# The request bucket for PLC directory lookups made while serving requests.
plc_request_rate_per_sec = 20.0
plc_request_burst = 40
# Identities (DIDs or handles) one requester may have resolved per second.
requester_resolutions_per_sec = 5.0
requester_resolutions_burst = 25
# Checking a member's sign-in token may need its identity document. Part of
# the PLC budget is kept for that, and one member can use it this often.
member_pool_refresh_secs = 600
# Looking up which account a handle (a name like alice.example.com) belongs
# to: how many answers are remembered, and for how many seconds. A found
# account is remembered longer than "no such handle"; a lookup that failed
# is never remembered.
resolve_handle_cache_max = 100000
resolve_handle_ttl_secs = 300
resolve_handle_negative_ttl_secs = 60

[kryphocron]
oracle_freshness_bound_secs = 120

[private_read]
bind_concurrency = 8
# Retry-After on a getMembership answer of `indexing`: a polling hint, not an
# estimate (private posting §4.1).
membership_retry_after_secs = 5

# Whole-handler latency floors, sized above each endpoint's worst case including
# one synchronous repo-head fetch round (design §6.9, §6.11.3).
[private_read.floor_ms]
get_posts = 1000
get_post_thread = 1200
get_author_feed = 1200
get_timeline = 1200
get_bookmarks = 1200
get_likes = 800
get_reposted_by = 800
get_quotes = 1200
list_notifications = 1200
get_unread_count = 300
get_replies = 1200
search_posts = 1500

# Private notifications (private posting §4.8): a write that is not live
# (backfill, catch-up, requestRecord, dead-letter replay) notifies only for a
# record created within this many hours, so old likes are not announced as new.
[private_notify]
backfill_max_age_hours = 48

# Private search (private posting §4.17): a bounded scan at query time, with no
# index of decoded text. A page reads at most scan_candidates private posts the
# requester may read, within span_hours below its cursor; a search reaches back
# max_age_days from its first page. span_hours must be at most 24 × max_age_days.
# If searchPosts nears its floor on the busiest week, lower span_hours or raise
# private_read.floor_ms.search_posts.
[private_search]
scan_candidates = 300
span_hours = 168
max_age_days = 365

# Repo-head check for tracked DIDs (design §6.11.3).
[sync]
head_max_age_secs = 60
max_head_fetches_per_request = 16
head_fetch_timeout_ms = 500
divergence_grace_secs = 300
# Independent per-PDS-host budgets (design §6.11.3). The prober rate is sized
# automatically from the tracked-DID count, up to this cap.
max_probe_rate_per_host = 25
# Synchronous read-time fetches never wait: no token = immediate miss.
read_fetch_rate_per_host = 25
# Listings read from another account's PDS while serving public requests:
# calls per second to one PDS host, and how many hosts are tracked at once.
public_fallback_rate_per_host = 25.0
max_public_fallback_hosts = 100000
# requestRecord's catch-up listings (private posting §3.8). Never waits: no
# token stops the catch-up and the answer says caughtUp: false.
catch_up_rate_per_host = 10

# requestRecord's catch-up (private posting §3.8): after indexing the record,
# a ready member or private owner's authorization collections are listed and
# applied_rev advanced, so the caller's private posts read at once. At most
# one catch-up per account in this interval, and this many pages in all.
[index_request]
catch_up_min_interval_secs = 10
catch_up_max_pages = 8

[db]
# Backstop against lock waits (design §6.11.7); a timeout is a transient failure.
lock_timeout_secs = 30

[admin]
# Mutating admin commands are executed by `serve` (design §3.3); the CLI waits
# this long for completion before giving up (the command keeps running).
command_timeout_secs = 600

[cache]
# In-process read-time cache budget (design §7.6).
read_time_bytes = 268435456
# The per-viewer private cache of viewer-private fetches (design-v4 §8.1):
# entry lifetime, entries over all viewers, entries per viewer.
viewer_private_ttl_secs = 3600
viewer_private_max = 50000
viewer_private_per_viewer_max = 500

[counts]
# local | local_then_constellation
public_source = "local_then_constellation"
fresh_secs = 300
stale_max_secs = 86400
sync_timeout_ms = 800
refresh_rate_per_sec = 20
refresh_queue_max = 100000

[microcosm]
slingshot_url = "https://slingshot.microcosm.blue"
constellation_url = "https://constellation.microcosm.blue"
# The request buckets for calls made while serving requests.
slingshot_rate_per_sec = 50.0
slingshot_burst = 100
constellation_rate_per_sec = 50.0
constellation_burst = 100

[backfill]
concurrency = 4
per_pds_rate_per_sec = 5
# Safety ceiling for "all" block/audience listings; hitting it leaves readiness
# unset so private reads fail closed (design §5.10).
full_listing_ceiling = 1000000
# Failed member/private/authz/resync jobs are re-queued on this schedule (design §5.10).
retry_every_hours = 6
# Reconcile deletions confirmed per job via getRecord (design §5.10).
reconcile_confirm_limit = 1000
# Follows a `following` audience's owner may have and still be verified; over
# it, that owner's `following` audiences are read by the owner alone
# (following-audience design §3.5, C-F2).
follows_pass_ceiling = 50000

[retention]
# Out-of-scope grace is scope.rebuild_grace_days (design §9.4); retention deletes
# rows of authors no longer in scope_dids on its next run.
# 0 disables the age cap for unprotected content.
max_age_days = 0
tombstone_days = 7
notification_days = 90
run_at_utc = "04:00"

[storage]
# 200 GiB. Drives db_budget_ratio and the budget warnings.
budget_bytes = 214748364800

# Every upstream that public requests reach has one request bucket. Each is
# split in two: signed-in members of this AppView draw on their own part
# first, and everyone else shares `nonmember_fraction` of it. Inside either
# part one requester (a member, or an IP address) gets at most
# `requester_share` of it, so no single caller can use it all up.
[constellation]
requester_share = 0.25
nonmember_fraction = 0.5
requester_share_max_entries = 200000

[[constellation.networks]]
name = "bluesky"
pds_patterns = ["*.host.bsky.network", "bsky.social"]
appview_url = "https://public.api.bsky.app"
auth = "unauth"
rate_per_sec = 20
burst = 40
enabled = true

[[constellation.networks]]
name = "community-a"
pds_patterns = ["community-a.example", "*.community-a.example"]
appview_url = "https://api.community-a.example"
auth = "unauth"
rate_per_sec = 10
burst = 20
enabled = true

[[constellation.networks]]
name = "community-b"
pds_patterns = ["community-b.example", "*.community-b.example"]
appview_url = "https://api.community-b.example"
# Unauthenticated reads return 401; service_jwt needs Community B's AppView DID,
# which api.community-b.example does not publish. Enable only after setting
# appview_did and passing design §14 check B-6.
auth = "service_jwt"
appview_did = ""
rate_per_sec = 10
burst = 20
enabled = false

[[constellation.networks]]
name = "community"
# Add the community PDS hostnames (exact host or *.suffix) here.
pds_patterns = []
appview_url = "local"
auth = "unauth"
enabled = true

[constellation.cascade]
order = ["bluesky", "community-a", "community-b"]

# Endpoints this AppView does not serve yet (feed generators, push,
# preferences, reports, video, age assurance, contact import) answer
# `501 NotImplemented` from registered routes. The set is fixed in the build.
[honest_501]
# Shown as the "See <link> for status." pointer. Empty drops that sentence.
status_url = ""
# Per-endpoint message overrides, keyed by NSID; `<link>` is replaced by
# status_url. Only deferred endpoints of this AppView are accepted.
# [honest_501.messages]
# "app.bsky.feed.getFeed" = "Feeds are coming. See <link>."

# Surfaces this build does not implement cannot be switched on: any `true`
# here is a startup error in this version.
[features]
feed_generators = false
embed_external_view = false
verification = false

# Request rate limits. Each class is a token bucket: `per_sec` tokens are
# added per second, up to `burst`. Read and search classes are keyed by IP
# for anonymous callers and by account for signed-in callers; `resolve` has
# one bucket per endpoint and IP; `global` is the per-IP backstop.
[rate_limits]
anon_read = { per_sec = 30.0, burst = 60 }
auth_read = { per_sec = 60.0, burst = 120 }
search_anon = { per_sec = 10.0, burst = 20 }
search_auth = { per_sec = 30.0, burst = 60 }
write = { per_sec = 5.0, burst = 20 }
private = { per_sec = 10.0, burst = 20 }
thread_lens = { per_sec = 2.0, burst = 10 }
index_request = { per_sec = 0.5, burst = 30 }
resolve = { per_sec = 10.0, burst = 20 }
global = { per_sec = 100.0, burst = 200 }
service_proxy_member = { per_sec = 5.0, burst = 20 }
service_proxy_ip = { per_sec = 10.0, burst = 20 }

# After an upgrade, a background task fills new columns for rows written
# before it (in batches, with a pause between them), then builds the large
# search indexes one at a time without blocking writes. Until it finishes,
# search and trends are incomplete for old posts. `_health` detail shows
# schema_backfill_done and search_indexes_ready.
[schema_backfill]
batch_size = 10000
pause_ms = 100

[schema_index]
# First wait after a failed index build; it doubles up to an hour.
retry_backoff_secs = 300

# Bounds on one thread view: posts shown in total, replies asked of
# Constellation per post, and posts fetched from Slingshot because they are
# not stored here.
[thread]
max_nodes = 200
constellation_replies_per_node = 50
max_remote_fetches = 100

# How many threads one member may mute. Past it, muting another is refused.
[thread_mutes]
max_per_actor = 10000

# How many accounts one member may ask to be notified about when they post.
# Past it, subscribing to another is refused.
[activity_subscriptions]
max_per_actor = 1000

# A post older than this (in seconds, by its own date) is not announced to
# the people subscribed to its author. One day by default.
[notifications]
subscribed_post_max_age_secs = 86400

# Search over the posts this AppView stores. A search that runs longer than
# statement_timeout_ms is refused as too expensive, so that one heavy query
# cannot hold the database; raise it on faster hardware.
[search]
statement_timeout_ms = 2000
hits_total_max = 10000           # the total is shown only up to this many matches
hits_total_timeout_ms = 500      # past this the page comes back without a total
max_offset = 1000                # how deep "top" results can be paged
recent_window_days = 30          # how far back a search looks unless it says otherwise
top_window_days = 30             # the same, for searchPosts sorted by "top"
max_filter_values = 25           # values one filter may list
top_candidates = 2000            # the newest matches a "top" search ranks
typeahead_candidates = 200       # rows a typeahead looks at before ranking

# Who and what gets suggested. Everything is worked out from the accounts
# and posts stored here; nothing is made up.
[suggestions]
active_days = 14                 # only accounts that posted this recently
refresh_secs = 600               # how long a computed list is reused
pool_size = 1000                 # accounts (or starter packs) kept per list
fof_max_follows = 500            # of a member's follows, the newest this many are read
fof_cache_ttl_secs = 600
fof_cache_max = 10000
see_more_offset = 25             # results the "see more" page skips
cofollow_sample_followers = 1000 # of an account's followers, the newest this many are read
cofollow_cache_ttl_secs = 600
cofollow_cache_max = 10000
cofollow_min = 5                 # below this, the most followed accounts fill the list
tagged_count = 10

# Trending hashtags, worked out from the posts and the likes, reposts and
# replies stored here. A tag needs min_posts posts by min_authors different
# accounts, so one account cannot make a tag trend.
[trends]
topics_window_hours = 6          # "trending topics" counts posts over this long
window_hours = 24                # "trends" measures engagement over this long
candidate_count = 50
min_posts = 3
min_authors = 2
decay_half_life_hours = 6.0      # engagement this old counts half
subject_lookback_hours = 72      # likes on posts older than this are ignored
aggregate_retention_hours = 72   # how long the hourly tallies are kept
refresh_timeout_ms = 10000       # past this, the previous list keeps being shown
started_ratio = 2.0
hot_ratio = 2.0                  # "hot": the last hour at this many times the average
cache_ttl_secs = 300
topic_link_template = "/hashtag/{tag}"
# Your own text for a tag, and topics you want to suggest:
#   [trends.descriptions]
#   rust = "The programming language"
#   [[trends.suggested_topics]]
#   topic = "#introductions"
#   link = "/hashtag/introductions"

# What app.bsky.unspecced.getConfig answers. This service holds nobody's
# email, so check_email_confirmed is your policy, not a fact about anyone.
# live_now lists accounts whose "live" status may link to the domains named:
#   live_now = [{ did = "did:plc:...", domains = ["twitch.tv"] }]
[unspecced]
check_email_confirmed = false
live_now = []

# How many posts one member may bookmark. Past it, bookmarking another is
# refused.
[bookmarks]
max_per_actor = 50000
# Whether a post shows how many members bookmarked it. Bookmarks are private,
# and in a small community a count of 1 points at one person, so the default
# is "never". "above_floor" shows the number only once it reaches count_floor;
# "always" shows it every time, zero included.
emit_count = "never"
count_floor = 10

# How a video embed's view is built, for public and private posts alike
# (private posting, Addendum A). "bsky_cdn": HLS and a thumbnail from the
# video CDN at cdn_url; the URLs are computed, and Prism makes no request to
# the CDN. A video the CDN never processed (uploaded straight to a PDS) does
# not play this way. "pds_blob": the MP4 blob on the author's PDS, with no
# thumbnail.
[video]
playback = "bsky_cdn"
cdn_url = "https://video.bsky.app"

# Unfinished posts a member saves to finish later: how many one member may
# keep, and the largest one (in bytes; 1 MiB).
[drafts]
max_per_actor = 1000
max_bytes = 1048576

# Anyone may ask which labels you applied to an account or to its records.
# This is how many accounts or records one such request may name.
[labels]
query_max_patterns = 25

# Apps ask about the labeling services their user subscribes to. This is how
# many services one such request may name.
[labelers]
get_services_max_dids = 50

# How often the "joined through this starter pack" numbers are recounted.
[starter_packs]
counts_refresh_secs = 3600

# "Followers you know": how many pages of an account's followers (100 each)
# one request may ask Constellation for. Each page uses the caller's
# Constellation allowance, so raise that with this.
[known_followers]
scan_max_pages = 20
# On an opened post whose author lets only "people I follow" reply: how many
# pages of your own followers (100 each) one request may ask Constellation
# for, to see whether the author follows you. 0 uses only follows stored here.
profile_scan_pages = 2

# "Liked by people you follow" on an opened post: how many pages of the
# post's likers (100 each) one request may ask Constellation for. 0 uses
# only the likes stored here.
[known_likers]
scan_max_pages = 5

# An opened post: how many of the posts it replies to, going up the
# conversation, the newer thread view returns above it.
[thread_v2]
max_parents = 80

# A feed post that is part of its author's own thread says where it sits
# ("2 of 5"). This is the longest such thread that gets worked out; a post in
# a longer one carries no position. 0 turns it off.
[op_thread]
max_walk = 50

# Thread Lens: the thread view that can show replies an ordinary view
# leaves out. One response adds at most page_nodes posts beyond the ordinary
# view (which is never cut); the client asks again for more. listing_calls
# bounds how many reply lists one response starts to read. The other three
# bound the block checks one response makes: the time one round of checks
# may take, how many rounds the walk up the parents may make, and how many
# different authors are checked.
# access says who may use it:
#   "signed_in"  every signed-in account, members or not (the default)
#   "members"    members of this server whose account is ready; anyone else
#                is refused
# Nobody may use it without signing in. An account that is not a ready
# member gets the same thread with its own blocks applied, but no likes,
# follows or mutes in it, and its block checks come out of the non-member
# part of the [farsight] rate below ([constellation] nonmember_fraction).
[threadlens]
access = "signed_in"
page_nodes = 200
listing_calls = 60
verdict_round_timeout_ms = 500
parent_rounds = 8
verdict_max_dids = 600

# Showing a list that no other AppView could answer for: how many pages of
# the list owner's records one request may read from the owner's server.
[lists]
read_listing_pages = 5

# A member's own list mutes and list blocks. To apply one, this server keeps
# a private copy of the list. These bound what one member can make it keep.
# Each limit counts mutes and blocks separately, so a member can hold twice
# as many in all.
#   subscribed_max_per_member  lists one member's mutes (or blocks) may use
#   max_owners_per_member      different list owners those lists may have
#   subscribed_max_items       entries kept of one list (the oldest ones)
# A list mute past the limit is refused. A list block past it is stored but
# has no effect, because the block lives in the member's own account.
subscribed_max_per_member = 25
max_owners_per_member = 10
subscribed_max_items = 50000
# Deleted list entries are remembered for a while so a late copy of one
# cannot bring it back. This many are remembered per list owner.
subscription_tombstones_max_per_owner = 10000

# Copying a list owner's lists from the owner's server ("list sync").
#   sync_min_interval_secs    least time between two copies for one owner
#   sync_max_concurrent       owners copied at once
#   sync_slow_max_concurrent  slow owners copied at once, on their own lane
# The two together must leave two of [backfill] concurrency free.
sync_min_interval_secs = 600
sync_max_concurrent = 1
sync_slow_max_concurrent = 1
# A copy that looks stuck for this long (seconds) is started over.
sync_stuck_secs = 5400
# One copy stops early when the owner has more than this many records, takes
# more than this many pages, answers slower than sync_min_records_per_call_sec
# after sync_probe_call_secs of waiting on it, or takes longer than
# sync_max_call_secs waiting on it or sync_max_wall_secs in all.
subscribed_max_owner_listitems = 1000000
sync_max_pages = 20000
sync_probe_call_secs = 60
sync_min_records_per_call_sec = 200
sync_max_call_secs = 900
sync_max_wall_secs = 3600

# Farsight is the block-list index of this stack. With url set, the app asks
# it, when a member loads a page, which accounts on that page block the
# member through a block list. With url unset (the default) it is never
# asked, and such blocks are not applied.
# url must be https and reach Farsight at a public address. Set
# FARSIGHT_TOKEN in .env to a Farsight API key with the read and backfill
# scopes. Whoever runs that Farsight sees which accounts each member's pages
# contain, and which accounts are in the threads that anyone opens with
# Thread Lens (see [threadlens] access), so point this at an instance you
# run or trust.
# Answers are kept for cache_ttl_secs, at most cache_entries_per_viewer for
# one account and cache_entries_total in all. When the total is reached,
# answers kept for accounts that are not ready members go first.
[farsight]
# url = "https://farsight.example.net"
timeout_ms = 500                 # one call, and all one request may wait
cache_ttl_secs = 30
cache_entries_per_viewer = 2000
cache_entries_total = 200000
max_calls_per_request = 3        # each call covers up to 100 accounts
rate_per_sec = 50.0              # keep at or below the key's limit on Farsight
burst = 100
# The most one account may use of that rate: a ready member of the members'
# part of it, and any other signed-in account of the non-member part.
requester_share = 0.25
prime_on_enroll = true          # ask Farsight to read a new member's repo

# A stand-in for when Farsight is down. Off unless you turn it on, and it
# needs farsight.url above. While Farsight has stopped answering, a ready
# member's pages ask one other AppView (an entry of the routing table
# below, which must not need sign-in) who blocks the member through a list.
# That AppView then sees the member's DID beside the accounts on its pages,
# which Farsight being yours avoids; that is why this is off by default.
# Its answers are never treated as complete, and Farsight's are never
# overridden by them.
[farsight.fallback]
enabled = false
network = "bluesky"              # which routing-table entry to ask
timeout_ms = 1000                # one call, and all one request may wait
max_calls_per_request = 2        # each call covers up to 30 accounts
cache_ttl_secs = 300             # how long one of its answers is kept
rate_per_sec = 10.0
burst = 20
requester_share = 0.25           # the most one member may use of that rate

# A memory of who blocks each member through a list, so those blocks keep
# applying while Farsight gives no answer, and across a restart. Off unless
# you turn it on, and it needs farsight.url above. What it stores says
# which accounts a member's pages showed, and roughly when, so it is kept
# only this long and only for members. A block Farsight later confirms is
# gone is forgotten at once; `admin farsight forget <did>` clears one member.
[farsight.memory]
enabled = false
retention_hours = 24             # a remembered block applies this long
max_per_viewer = 1000            # blocks remembered for one member
max_total = 100000               # blocks remembered in all

# Limits on checking sign-in tokens before a request is charged to anyone.
# They stop forged or broken tokens from using up CPU or a member's limits.
[auth]
# Tokens that fail to verify: per client address, and per (address, account).
failed_verify_rate_per_sec = 10.0
failed_verify_burst = 20
failed_verify_per_iss_rate_per_sec = 1.0
failed_verify_per_iss_burst = 5
# An account that verified from an address within this window is not held
# back by the two limits above at that address.
failed_verify_success_window_secs = 86400
failed_verify_state_max = 100000
failed_verify_success_ips_max = 16
# Failing checks one client address may cost, and valid checks one account
# may cost.
verify_rate_per_sec = 500.0
verify_burst = 1000
member_verify_rate_per_sec = 200.0
member_verify_burst = 400

# Move one served endpoint to another class family: "read", "search",
# "write", "private", "thread_lens", "index_request" or "resolve". An
# endpoint that accepts anonymous calls can only take "read", "search" or
# "resolve".
# [rate_limits.endpoint_class]
# "app.bsky.feed.getTimeline" = "search"

# Deferred external services. Each is "disabled" (the default: its endpoints
# answer 501) or "proxy" (they are forwarded to proxy_url). "serve" is
# reserved and refused in this version, and push accepts only "disabled".
# Built-in blocks: [services.contact], [services.age_assurance],
# [services.push]. They never need to appear in this file.
# See "Forwarding a service to another server" in the README.
#
# The keys below proxy_url are accepted only with state = "proxy"; the
# values shown are the defaults.
# [services.contact]
# state = "proxy"
# proxy_url = "https://contact.example.net"
# aud_fragments = ["bsky_appview"]   # token audiences accepted beside a bare one
# timeout_ms = 10000                 # the call to the target
# body_read_timeout_ms = 10000       # reading the caller's request body
# max_request_bytes = 1048576
# max_response_bytes = 4194304
# max_in_flight = 64                 # calls in progress; over it, 503
# rate_per_sec = 20                  # all callers together, to this target
# burst = 40
# allow_private_network = false      # true: http and private addresses
#
# A custom service declares its own NSIDs and verbs. While disabled it
# registers nothing. NSIDs in com.atproto.*, app.bsky.*, chat.bsky.*,
# tools.ozone.*, tools.kryphocron.* and app.nearhorizon.* are refused.
# [services.eu_region_notices]
# state = "disabled"
# methods = { "eu.example.region.getNotices" = "GET" }
