[package]
name = "horizon-prism-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "horizon_prism_rs"
path = "src/lib.rs"

[[bin]]
name = "horizon-prism-rs"
path = "src/main.rs"

[features]
# The B-5 bench's in-process head source (private-threads design §4). Never
# in a deploy build: serve refuses to start under it without
# `bench.heads_file`, and a featureless build refuses a `[bench]` section.
bench-heads = []

# Versions pinned major/minor per design-v2 §3.1.
[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "timeout", "limit", "request-id", "cors"] }
# Postgres only (lock #2): the default `any` feature is off. Runtime-checked
# queries only; no query!/query_as! macros, so builds need no database.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "json"] }
redis = { version = "0.27", features = ["tokio-comp", "aio", "streams", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Same line as proto-blue-identity 0.3.3, so one hickory is in the graph.
hickory-resolver = "0.26"
# Named to recognise a certificate failure in a connection error (handle
# resolution, design-v3 §5.11), and to build the `viewer_private` client's
# TLS without session resumption (design-v4 §8.1) from reqwest's own
# provider and roots. reqwest already brings both in.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
webpki-roots = "1"
ipnet = "2"
kryphocron = "0.4"
kryphocron-lexicons = "0.3"
proto-blue = "0.3.3"
k256 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
governor = "0.10"
moka = { version = "0.12", features = ["future", "sync"] }
futures = "0.3"
arc-swap = "1"
rand = "0.9"
chrono = "0.4"
hex = "0.4"
base64 = "0.22"
# Seals Thread Lens paging cursors (design-v3 §5.15.14).
chacha20poly1305 = "0.10"
blake3 = "1"
thiserror = "2"
anyhow = "1"
# kryphocron's HttpDidFetcher and proto-blue's FetchHandler are #[async_trait].
async-trait = "0.1"
url = "2"
unicode-normalization = "0.1"

[dev-dependencies]
# tokio::time::pause for the lag sampler's hang test (firehose throughput §4.5).
tokio = { version = "1", features = ["test-util"] }
