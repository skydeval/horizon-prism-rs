# design-v2 §3.1, §6.3: the public codec surface is bypassable, so it is
# forbidden outright. Private content is decoded only through
# kryphocron::decode_record_content behind a ReadAuthorization witness. The
# codec is installed in the at-rest hooks; the one place that names it is
# kryphocron_glue::bounded_codec, under an #[expect], which builds it with its
# decode bound and never calls it (private-embeds design S3).
disallowed-methods = [
    { path = "kryphocron::encryption::ContentCodec::decode", reason = "decode only via kryphocron::decode_record_content (design-v2 §6.3)" },
]
disallowed-types = [
    { path = "kryphocron::encryption::DecodeContext", reason = "decode only via kryphocron::decode_record_content (design-v2 §6.3)" },
    { path = "kryphocron::codec::laquna::Codec", reason = "the codec is installed in the at-rest hooks by kryphocron_glue::at_rest_hooks (design-v2 §6.6)" },
]
